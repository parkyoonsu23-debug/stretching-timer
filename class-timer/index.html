<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수업 타이머</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10162a">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#10162a;--fg:#f4f6ff;--mute:#8d97b8;--acc:#4f8cff;--ok:#33c28a;--warn:#ffb340;--bad:#ff5d6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans KR",sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);transition:background .4s}
body.warn{background:#2a2410}body.done{background:#3a1218;animation:blink 1s infinite}
@keyframes blink{50%{background:#5a1a22}}
h1{font-size:16px;color:var(--mute);margin:14px 0 0;font-weight:600}
.ring{position:relative;width:min(78vw,52vh);aspect-ratio:1;margin:12px 0}
svg{width:100%;height:100%;transform:rotate(-90deg)}
.bg{stroke:#222b4a}.fg{stroke:var(--acc);stroke-linecap:round;transition:stroke .4s}
.warn .fg{stroke:var(--warn)}.done .fg{stroke:var(--bad)}
#time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:min(20vw,13vh);font-weight:700;font-variant-numeric:tabular-nums}
#sub{font-size:14px;font-weight:400;color:var(--mute)}
.presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
button{font:inherit;color:var(--fg);background:#1d2646;border:0;border-radius:12px;padding:10px 14px;font-size:16px}
button:active{filter:brightness(1.3)}
.presets button.sel{background:var(--acc)}
.row{display:flex;gap:10px;margin:14px 0;align-items:center}
.main{background:var(--ok);font-size:22px;font-weight:700;padding:14px 38px;border-radius:16px}
.main.run{background:var(--warn);color:#222}
input{width:70px;font:inherit;font-size:18px;text-align:center;border-radius:10px;border:0;padding:9px;background:#1d2646;color:var(--fg)}
label{color:var(--mute);font-size:14px}
</style></head><body>
<h1>수업 타이머</h1>
<div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="45" fill="none" stroke-width="6"/><circle id="arc" class="fg" cx="50" cy="50" r="45" fill="none" stroke-width="6" stroke-dasharray="282.74" stroke-dashoffset="0"/></svg>
<div id="time">10:00<span id="sub">대기 중</span></div></div>
<div class="presets" id="presets"></div>
<div class="row"><label>직접 입력</label><input id="min" type="number" min="0" max="180" value="" placeholder="분"><label>분</label><input id="sec" type="number" min="0" max="59" value="" placeholder="초"><label>초</label></div>
<div class="row"><button id="reset">초기화</button><button id="go" class="main">시작</button><button id="add">+1분</button></div>
<script>
const $=id=>document.getElementById(id);
let total=600,left=600,run=false,end=0,tick=null,lock=null;
const PRE=[1,3,5,10,15,20,30,40,50];
PRE.forEach(m=>{const b=document.createElement('button');b.textContent=m+'분';b.onclick=()=>set(m*60);b.dataset.s=m*60;$('presets').appendChild(b)});
function fmt(s){s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(r).padStart(2,'0')}
function draw(){
 $('time').firstChild.nodeValue=fmt(left);
 $('arc').style.strokeDashoffset=282.74*(1-(total?left/total:0));
 document.body.classList.toggle('warn',run&&left<=60&&left>0);
 document.body.classList.toggle('done',left<=0&&total>0&&!run&&finished);
 $('go').textContent=run?'일시정지':(left<total&&left>0?'계속':'시작');
 $('go').classList.toggle('run',run);
 document.querySelectorAll('.presets button').forEach(b=>b.classList.toggle('sel',+b.dataset.s===total));
}
let finished=false;
function set(s){try{localStorage.setItem('ct_last',s)}catch(e){}stop();total=left=s;finished=false;$('sub').textContent='대기 중';draw()}
async function wake(on){try{if(on&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen')}else if(lock){lock.release();lock=null}}catch(e){}}
let ctx=null,nodes=[];
function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function schedule(sec){cancelBeep();try{const a=ac(),t0=a.currentTime+sec;[0,.4,.8].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.5,t0+d+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d+.3);o.start(t0+d);o.stop(t0+d+.32);nodes.push(o)})}catch(e){}}
function cancelBeep(){nodes.forEach(o=>{try{o.stop()}catch(e){}});nodes=[]}
function buzz(){try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400])}catch(e){}}
function stop(){cancelBeep();run=false;clearInterval(tick);wake(false)}
function start(){if(left<=0)return;run=true;finished=false;end=Date.now()+left*1000;$('sub').textContent='진행 중';wake(true);schedule(left);tick=setInterval(()=>{left=(end-Date.now())/1000;if(left<=0){left=0;stop();finished=true;$('sub').textContent='시간 종료!';buzz()}draw()},200);draw()}
$('go').onclick=()=>{if(run){stop();$('sub').textContent='일시정지'}else{if(finished)set(total);start()}draw()};
$('reset').onclick=()=>set(total);
$('add').onclick=()=>{total+=60;left+=60;if(run){end+=60000;schedule(left)}finished=false;draw()};
function custom(){const s=(+$('min').value||0)*60+(+$('sec').value||0);if(s>0)set(s)}
$('min').onchange=$('sec').onchange=custom;
document.addEventListener('visibilitychange',()=>{if(run&&!document.hidden)wake(true)});
let init=600;try{init=+localStorage.getItem('ct_last')||600}catch(e){}
set(init);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
