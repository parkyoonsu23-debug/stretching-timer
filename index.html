<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스트레칭 타이머</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A18" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F3; --surface:#FFFFFF; --ink:#1E2B28; --muted:#5D6B67; --line:#D6DEDA;
  --move:#1B8A72; --stretch:#D44A5C; --contract:#2D68D2; --prep:#7B8784;
  --move-soft:#E1F2EC; --stretch-soft:#FBE6E9; --contract-soft:#E3ECFB; --prep-soft:#E8ECEA;
  --num:"Anybody","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131A18; --surface:#1B2421; --ink:#E6EEEB; --muted:#98A6A1; --line:#2B3632;
    --move:#45C4A5; --stretch:#FF6C7C; --contract:#6E9EFF; --prep:#8F9C98;
    --move-soft:#16312A; --stretch-soft:#3A1E23; --contract-soft:#1A2640; --prep-soft:#222C29;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131A18; --surface:#1B2421; --ink:#E6EEEB; --muted:#98A6A1; --line:#2B3632;
  --move:#45C4A5; --stretch:#FF6C7C; --contract:#6E9EFF; --prep:#8F9C98;
  --move-soft:#16312A; --stretch-soft:#3A1E23; --contract-soft:#1A2640; --prep-soft:#222C29;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;overscroll-behavior-y:contain;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--ui);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--contract);outline-offset:2px}
.screen{max-width:560px;margin:0 auto;padding:18px 18px 28px}
.screen[hidden]{display:none!important}

/* 목록 */
.home-head h1{font:700 26px/1.2 var(--ui);letter-spacing:-.01em;margin:10px 0 10px}
.legend[hidden]{display:none}
.resume{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--contract);border-radius:12px;padding:12px 14px;margin:0 0 16px}
.resume[hidden]{display:none}
.resume-txt{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.resume-txt span{font-size:13.5px;color:var(--muted)}
.resume-act{display:flex;gap:8px}
.resume-act button{flex:1;padding:11px 12px;font-size:15px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--prep-soft);border-radius:12px;margin:0 0 16px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 8px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.legend{list-style:none;margin:0 0 24px;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw.move{background:var(--move)}.sw.stretch{background:var(--stretch)}.sw.contract{background:var(--contract)}
.group h2{font:600 15px/1.3 var(--ui);color:var(--muted);margin:0 0 8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .rt:only-child{grid-column:1/-1}
.rt{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 17px;cursor:pointer;min-height:136px}
.rt::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 3px 3px 0;background:var(--rail)}
.dynamic{--rail:var(--move)}.static{--rail:var(--stretch)}.strength{--rail:var(--contract)}
.rt-label{font:600 16px/1.3 var(--ui)}
.rt-min{display:flex;align-items:baseline;gap:3px;margin:6px 0 4px;color:var(--rail)}
.rt-min b,.pv-min b{font-family:var(--num);font-weight:700;font-variation-settings:"wdth" 120,"wght" 700;line-height:1}
.rt-min b{font-size:44px}
.rt-min span{font-size:14px;font-weight:600}
.rt-focus{font-size:13px;line-height:1.45;color:var(--muted)}
.rt-count{margin-top:auto;padding-top:8px;font-size:12px;color:var(--muted)}
.pair.rows{grid-template-columns:1fr;gap:8px}
.rt.row{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:12px;align-items:center;min-height:0;padding:11px 14px 11px 17px}
.rt.row .rt-label{grid-column:1;grid-row:1}
.rt.row .rt-count{grid-column:1;grid-row:2;margin:0;padding:2px 0 0}
.rt.row .rt-min{grid-column:2;grid-row:1/3;margin:0}
.rt.row .rt-min b{font-size:28px}
.rt.row::before{top:10px;bottom:10px}
.group{margin:0 0 18px}
.settings{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.settings summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0;list-style:none}
.settings summary::-webkit-details-marker{display:none}
.settings summary::after{content:" ▾";font-size:12px}
.settings[open] summary::after{content:" ▴"}
.settings-body{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;margin-top:10px}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer}
.toggle input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .2s}
.toggle input:checked{background:var(--move)}
.toggle input:checked::after{transform:translateX(16px)}
.prep-choice{display:flex;align-items:center;gap:6px}
.prep-choice[hidden]{display:none}
.prep-choice>span{color:var(--muted);margin-right:2px}
.prep-choice button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.prep-choice button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* 미리보기 */
.bar{display:flex;align-items:center;margin:0 0 6px}
.back{background:none;border:0;padding:8px 6px 8px 0;color:var(--muted);display:flex;align-items:center;gap:2px;cursor:pointer;font-size:15px}
#pvTitle{font:700 24px/1.3 var(--ui);letter-spacing:-.01em;margin:4px 0 8px}
.pv-meta{display:flex;align-items:baseline;gap:14px;margin:0 0 6px}
.pv-min{display:flex;align-items:baseline;gap:3px;color:var(--rail)}
.pv-min b{font-size:40px}
.pv-min span,.pv-count{font-size:14px;font-weight:600}
.pv-count{color:var(--muted)}
#pvFocus{margin:0;color:var(--muted);font-size:14.5px}
.pnf-note{background:var(--contract-soft);border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.5;margin:14px 0 0}
.pnf-note b{color:var(--contract)}
.steps{list-style:none;margin:12px 0 0;padding:0 0 100px}
.steps.has-img li{grid-template-columns:22px 64px 1fr 36px}
.steps li{display:grid;grid-template-columns:30px 1fr 36px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.no{font-family:var(--num);font-weight:600;font-size:18px;font-variation-settings:"wdth" 90,"wght" 600;color:var(--muted);align-self:start;padding-top:1px}
.st-name{display:block;font-weight:500;line-height:1.45}
.st-detail{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:700;color:var(--contract);border:1px solid currentColor;border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px;line-height:1.5}
.from{border:0;background:var(--prep-soft);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.start-bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
.primary,.ghost{border-radius:12px;padding:15px 18px;font-weight:600;font-size:16px;cursor:pointer}
.primary{background:var(--ink);color:var(--paper);border:0}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.start-bar .primary{display:block;width:100%;max-width:524px;margin:0 auto}
.start-bar .primary:disabled{opacity:.45;cursor:default}
.chip{margin-left:auto;align-self:center;background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[hidden]{display:none}
.edit-note{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;background:var(--prep-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;margin:14px 0 0}
.edit-note[hidden]{display:none}
.edit-note .chip{background:var(--surface)}
.steps.editing li{grid-template-columns:30px 1fr 44px}
.steps.has-img.editing li{grid-template-columns:22px 64px 1fr 44px}
.steps li.off .thumb,.steps li.off .st-name,.steps li.off .st-detail{opacity:.42}
.steps li.off .st-name{text-decoration:line-through}
.steps .toggle{justify-content:center}
.off-tag{font-size:12px;font-weight:600;color:var(--muted);text-align:center}

/* 타이머 */
#timer{--k:var(--prep);--k-soft:var(--prep-soft);--wd:100;display:flex;flex-direction:column;min-height:100%;padding-top:10px;padding-bottom:14px}
#timer[data-kind="move"]{--k:var(--move);--k-soft:var(--move-soft);--wd:104}
#timer[data-kind="stretch"],#timer[data-kind="breath"]{--k:var(--stretch);--k-soft:var(--stretch-soft);--wd:132}
#timer[data-kind="contract"]{--k:var(--contract);--k-soft:var(--contract-soft);--wd:56}
#timer[data-kind="set"]{--k:var(--contract);--k-soft:var(--contract-soft);--wd:100}
#timer[data-kind="breath"][data-breath="in"]{--wd:142}
#timer[data-kind="breath"][data-breath="out"]{--wd:70}
.t-top{display:grid;grid-template-columns:40px 1fr 48px;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--prep-soft);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
#tTitle{font-size:14px;color:var(--muted);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.t-step{font-family:var(--num);font-weight:600;font-size:15px;font-variation-settings:"wdth" 100,"wght" 600;color:var(--muted);text-align:right}
.t-progress{height:4px;background:var(--line);border-radius:2px;margin:10px 0 0;overflow:hidden}
.t-progress i{display:block;height:100%;background:var(--ink);transform-origin:left center;transform:scaleX(0)}
.t-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 0;min-height:0}
.tags{display:flex;gap:6px;min-height:26px;justify-content:center}
.tag{font-size:13px;font-weight:600;padding:3px 11px;border-radius:999px;background:var(--k-soft);color:var(--k);line-height:1.5}
.tag:empty{display:none}
#tName{font:700 clamp(18px,5vw,23px)/1.32 var(--ui);letter-spacing:-.01em;margin:8px 0 2px;max-width:22em}
#tDetail{margin:0;color:var(--muted);font-size:14px}
.ring{--rs:min(46vw,23vh,230px);position:relative;width:var(--rs);height:var(--rs);margin:10px 0 4px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center;border-radius:50%}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.track{fill:none;stroke:var(--line);stroke-width:9}
.arc{fill:none;stroke:var(--k);stroke-width:9;stroke-linecap:round}
.num{font-family:var(--num);font-weight:700;font-size:calc(var(--rs)*.36);line-height:1;color:var(--k);font-variant-numeric:tabular-nums;font-variation-settings:"wdth" var(--wd),"wght" 700;transition:font-variation-settings .6s ease,opacity .2s}
.num.long{font-size:calc(var(--rs)*.25)}
#timer[data-breath="in"] .num{transition-duration:4s,.2s}
#timer[data-breath="out"] .num{transition-duration:6s,.2s}
#timer.paused .num{opacity:.4}
.under{position:absolute;left:0;right:0;bottom:21%;font-size:14px;color:var(--muted);font-weight:500}
.cue{min-height:24px;margin:6px 0 0;font-size:15px;font-weight:600;color:var(--k)}
.dots{display:flex;gap:8px;margin-top:8px}
.dots[hidden]{display:none}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--contract)}
.set-done{display:block;width:100%;max-width:340px;margin:12px auto 0;background:var(--k);color:var(--paper);border:0;border-radius:14px;padding:16px;font-weight:700;font-size:18px;cursor:pointer}
.set-done[hidden]{display:none}
svg[hidden]{display:none}
#timer.strength .t-figure{height:clamp(110px,21vh,210px);margin-top:6px}
#timer.strength .ring{--rs:min(40vw,18vh,190px);margin:8px 0 2px}
#timer.strength .set-done{margin-top:8px;padding:14px}
#timer.strength .cue{margin-top:4px;min-height:22px}
.next{margin:0 0 12px;text-align:center;font-size:14px;color:var(--muted);min-height:21px}
.t-controls{display:flex;justify-content:center;align-items:flex-start;gap:26px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;min-width:64px}
.ci{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.cl{font-size:12px;color:var(--muted)}
.ctl.play .ci{width:74px;height:74px;background:var(--ink);color:var(--paper);border:0}
.confirm{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center}
.confirm[hidden]{display:none}
.confirm p{margin:0 0 14px;font-weight:600}
.confirm div{display:flex;gap:10px;max-width:524px;margin:0 auto}
.confirm button{flex:1}

/* 완료 */
#done{display:flex;align-items:center;justify-content:center;height:100%}
.done-wrap{text-align:center;width:100%}
.done-wrap svg{color:var(--move)}
#dTitle{font:700 22px/1.4 var(--ui);margin:14px 0 6px}
#dTime{margin:0 0 26px;color:var(--muted)}
.done-actions{display:flex;gap:10px;max-width:400px;margin:0 auto}
.done-actions button{flex:1}

/* 동작 그림 */
.t-figure{width:100%;max-width:520px;height:clamp(140px,29vh,300px);margin:10px auto 2px;background:#FBFBFA;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:6px;cursor:zoom-in}
.t-figure[hidden]{display:none}
.lg{width:100%;max-width:380px;margin:6px auto 0;display:grid;gap:8px}
.lg[hidden]{display:none}
.lg-row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left}
.lg-top{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.lg-n{font-weight:700;font-size:15px}.lg-n i{font-style:normal;color:var(--k);margin-right:6px}
.lg-t{font-size:12px;color:var(--muted);white-space:nowrap}
.lg-ctls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.lg-c{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-radius:10px;padding:2px}
.lg-c button{width:38px;height:38px;border:0;border-radius:8px;background:var(--surface);color:var(--ink);font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 0 0 1px var(--line) inset}
.lg-c label{display:flex;align-items:baseline;gap:2px;font-size:13px;color:var(--muted)}
.lg-c input{width:52px;border:0;background:transparent;text-align:right;font:700 20px/1 var(--num);color:var(--ink);padding:0;-moz-appearance:textfield}
.lg-c input::-webkit-outer-spin-button,.lg-c input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lg-warm{background:var(--k-soft,var(--paper));border-radius:10px;padding:7px 10px;font-size:12.5px;line-height:1.4;color:var(--ink);text-align:left}
.lg-h{margin-top:5px;font-size:12px;color:var(--muted);line-height:1.35}
.lg-h.up{color:var(--k);font-weight:700}
#timer.logset .ring{display:none}
#timer.logset .cue{margin-top:6px}
.ver{margin:10px 0 0;font-size:12px;color:var(--muted)}
.rt-last{margin-top:6px;font-size:12px;color:var(--muted)}
.rt-last b{color:var(--rail);font-weight:700;margin-right:4px}
.rt.next{box-shadow:0 0 0 2px var(--rail) inset}
.t-figs{display:flex;gap:8px;width:100%;max-width:520px;margin:0 auto}
.t-figs .t-figure{flex:1 1 0;min-width:0;max-width:none;margin:10px 0 2px}
.pair-list{list-style:none;margin:6px auto 0;padding:0;width:100%;max-width:360px;display:grid;gap:6px}
.pair-list[hidden],#tName[hidden],#tDetail[hidden]{display:none}
.pair-list li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.pair-list b{color:var(--k);font-size:14px}
.pair-list .pn{font-weight:700;font-size:15px}
.pair-list .pr{color:var(--muted);font-size:13px;white-space:nowrap}
#timer.pair .t-figure{height:clamp(96px,17vh,170px)}
#timer.pair.strength .ring{--rs:min(38vw,17vh,165px)}
.t-figure img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.thumb{width:64px;height:48px;object-fit:contain;background:#FBFBFA;border:1px solid var(--line);border-radius:8px;padding:2px}
.zoom{position:fixed;inset:0;z-index:20;background:rgba(10,14,13,.88);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));cursor:zoom-out}
.zoom[hidden]{display:none}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;background:#FBFBFA;border-radius:12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .t-figure img,:root:not([data-theme="light"]) .thumb{filter:brightness(.93)}}

@media (prefers-reduced-motion: reduce){
  .num,.toggle input,.toggle input::after{transition:none!important}
}
</style>
</head>
<body>

<main id="home" class="screen">
  <header class="home-head">
    <h1>스트레칭 타이머</h1>
  </header>
  <div id="resume" class="resume" hidden>
    <div class="resume-txt"><b id="resumeTitle"></b><span id="resumeInfo"></span></div>
    <div class="resume-act"><button type="button" id="resumeGo" class="primary">이어서 하기</button><button type="button" id="resumeDrop" class="ghost">그만두기</button></div>
  </div>
  <div class="tabs" role="tablist" aria-label="운동 종류">
    <button type="button" role="tab" id="tabStretch" data-tab="stretch">스트레칭</button>
    <button type="button" role="tab" id="tabStrength" data-tab="strength">근력 운동</button>
  </div>
  <ul class="legend" id="legendStretch">
    <li><i class="sw move"></i>움직이며 풀기</li>
    <li><i class="sw stretch"></i>늘린 채 유지</li>
    <li><i class="sw contract"></i>힘주기 (PNF)</li>
  </ul>
  <p class="legend" id="legendStrength" hidden>세트를 마치면 '세트 완료'를 누르세요. 쉬는 시간은 자동으로 재요.</p>
  <div id="groups"></div>
  <details class="settings"><summary>설정</summary><div class="settings-body">

/* 잠금 화면·알림창에서 보이는 정보와 버튼 */
function updateMedia(){
  try{
    if(!('mediaSession' in navigator)||typeof MediaMetadata==='undefined'||!R||!R.active)return;
    const seg=R.segs[R.idx],st=R.rt.steps[seg.step];
    let t=pairName(seg);
    if(seg.type==='set')t+=' · '+setLbl(seg);
    else if(seg.type==='rest')t='휴식 · 다음 '+pairName(seg);
    else if(seg.type==='prep')t='준비 · '+st.n;
    navigator.mediaSession.metadata=new MediaMetadata({title:t,artist:R.rt.title,album:'운동 타이머'});
    navigator.mediaSession.playbackState=R.paused?'paused':'playing';
  }catch(e){}

    const set=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f);}catch(e){}};
    set('play',()=>{if(R&&R.active&&R.paused)togglePause();});
    set('pause',()=>{if(R&&R.active&&!R.paused)togglePause();});
    set('nexttrack',()=>{if(R&&R.active){if(R.segs[R.idx].type==='set')setDone();else goSkip();}});
    set('previoustrack',()=>{if(R&&R.active)goPrev();});

function keepAlive(on){
  keepMedia(on);
  if(!ac)return;
  try{
    if(on&&!keep){
      const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
      o.frequency.value=25;g.gain.setValueAtTime(0,t);g.gain.setTargetAtTime(0.004,t,0.3);
      o.connect(g);g.connect(ac.destination);o.start(t);
      keep={o,g};
    }else if(!on&&keep){
      const k=keep,t=ac.currentTime;keep=null;
      k.g.gain.setTargetAtTime(0,t,0.15);k.o.stop(t+1);
      setTimeout(()=>{try{k.g.disconnect();}catch(e){}},1500);
    }
  }catch(e){}
}
function checkSync(now){ /* 전화 등으로 오디오가 멈췄다 돌아오면 예약을 다시 맞춤 */
  if(!R||R.paused||!ac)return;
  if(ac.state!=='running'){try{ac.resume();}catch(e){}return;}
  if(!settings.sound||!R.anchor)return;
  const drift=(ac.currentTime-R.anchor.a)-(now-R.anchor.p)/1000;
  if(Math.abs(drift)>0.3)book(false);
}

    }
    if(!d)d=seg.warm?warmDefault(st,seg,R.sid):logDefault(st,seg.setNo,seg.setTotal,R.sid);

  if(seg.type==='set'){say(speakName(st.n)+', '+seg.setNo+'세트. '+st.rp+(st.per?', '+st.per:''));return;}
  if(seg.type==='rest'){say('휴식 '+fmtRest(seg.dur)+'. 다음, '+speakName(st.n)+(seg.step2!=null?', 이어서 '+speakName(R.rt.steps[seg.step2].n):'')+', '+(seg.warm?'워밍업 ':'')+seg.setNo+'세트');return;}

  if(seg.type==='switch'){say((seg.phase||'반대쪽')+' 준비');return;}
  if(st.k==='breath'){say('코로 천천히 들이마시고, 입으로 길게 내쉬세요');return;}

    arcEl.style.strokeDashoffset='0';
    barEl.style.transform='scaleX('+Math.min(1,R.cum[R.idx]/R.total)+')';
    if(R.paused&&underEl.textContent!=='탭해서 계속')underEl.textContent='탭해서 계속';
    return;
  }
  const whole=Math.max(0,Math.ceil(rem-0.001));
  const txt=whole>=60?Math.floor(whole/60)+':'+String(whole%60).padStart(2,'0'):String(whole);
  if(numEl.textContent!==txt){numEl.textContent=txt;numEl.classList.toggle('long',txt.length>2);}
  const frac=Math.max(0,Math.min(1,rem/seg.dur));
  arcEl.style.strokeDashoffset=String(CIRC*(1-frac));
  const done=R.cum[R.idx]+(seg.dur-Math.max(0,rem));
  barEl.style.transform='scaleX('+Math.min(1,done/R.total)+')';
  if(R.paused){
    if(underEl.textContent!=='탭해서 계속')underEl.textContent='탭해서 계속';
  }else if(seg.type==='work'&&st.k==='breath'){
    const e=seg.dur-rem,inh=(e%10)<4,lab=inh?'들이마시기 4초':'내쉬기 6초',b=inh?'in':'out';
    if(underEl.textContent!==lab)underEl.textContent=lab;
    if(T.dataset.breath!==b)T.dataset.breath=b;
  }
}
/* 시간 진행: 화면이 보일 때는 화면 갱신과 함께, 꺼져 있을 때는 뒤에서 계속 */
function advance(now){
  if(R.paused)return true;
  let moved=false;
  while(!R.segs[R.idx].manual&&now-R.segStart>=R.segs[R.idx].dur*1000){
    if(R.idx>=R.segs.length-1){finish(true);return false;}
    R.segStart+=R.segs[R.idx].dur*1000;
    R.idx++;moved=true;
  }
  if(moved)enterSegment(now-R.segStart<3000);
  if(now-(R.syncAt||0)>=1000){R.syncAt=now;checkSync(now);}
  return true;
}
function frame(){
  if(!R||!R.active)return;
  const now=performance.now();
  if(!advance(now))return;
  render(R.paused?R.pauseRemain/1000:R.segs[R.idx].dur-(now-R.segStart)/1000);
  R.raf=requestAnimationFrame(frame);
}
function bgTick(){if(R&&R.active)advance(performance.now());}
function paintPlay(){
  T.classList.toggle('paused',R.paused);
  $('#icPause').toggleAttribute('hidden',R.paused);$('#icPlay').toggleAttribute('hidden',!R.paused);
  const lab=R.paused?'계속':'일시정지';
  $('#tPlayLabel').textContent=lab;
  $('#tPlay').setAttribute('aria-label',lab);
  $('#tRing').setAttribute('aria-label',lab);
}
function togglePause(){
  if(!R||!R.active)return;
  ensureAudio();
  const now=performance.now();
  if(!R.paused){
    R.paused=true;R.pausedAt=now;
    R.pauseRemain=R.segs[R.idx].dur*1000-(now-R.segStart);
    hush();unbook();keepAlive(false);
  }else{
    R.paused=false;R.pausedTotal+=now-R.pausedAt;
    R.segStart=now-(R.segs[R.idx].dur*1000-R.pauseRemain);
    paintSegment();book(false);keepAlive(wantKeep());
  }
  paintPlay();persist();updateMedia();
}
function jump(i){
  R.idx=Math.max(0,Math.min(R.segs.length-1,i));
  R.segStart=performance.now();
  if(R.paused)R.pauseRemain=R.segs[R.idx].dur*1000;
  enterSegment(true);
  if(!R.paused)book(true);
}
function goPrev(){
  if(R.rt.type==='strength'){
    let j=R.idx-1;while(j>=0&&R.segs[j].type!=='set')j--;
    if(R.segs[R.idx].type==='rest'&&j>=0){jump(j);return;}
    jump(j>=0?j:R.idx);return;
  }
  const p=prepIndexOf(R.segs[R.idx].step);
  if(R.idx>p){jump(p);return;}
  let j=p-1;while(j>=0&&R.segs[j].type!=='prep')j--;
  jump(j>=0?j:p);
}
function goSkip(){
  if(R.idx>=R.segs.length-1){finish();return;}
  jump(R.idx+1);
}
function startRoutine(rt,fromStep,replace,restore){
  const v=view(rt),segs=buildSegments(v);
  if(!segs.length)return;
  ensureAudio();
  current=rt;
  if(replace)history.replaceState({s:'timer'},'');else history.pushState({s:'timer'},'');
  if(R){R.active=false;if(R.raf)cancelAnimationFrame(R.raf);if(R.iv)clearInterval(R.iv);}
  unbook();
  const cum=[];let acc=0;
  segs.forEach((s,i)=>{cum[i]=acc;acc+=segW(s);});
  R={rt:v,base:rt,segs,cum,total:acc,idx:0,active:true,paused:false,pausedTotal:0,back:(restore&&!replace)?-1:-2,sid:(restore&&restore.sid)||Date.now()};
  const mark=v.type==='strength'?'set':'prep';
  R.order=[];segs.forEach(s=>{if(s.type===mark&&R.order.indexOf(s.step)<0)R.order.push(s.step);});
  let si=segs.findIndex(s=>s.type===mark&&(s.step>=(fromStep||0)||(s.step2!=null&&s.step2>=(fromStep||0))));if(si<0)si=0;
  R.idx=si;R.startIdx=si;
  R.segStart=performance.now();R.startedAt=R.segStart;
  if(restore){
    const now=performance.now(),wall=Date.now();
    R.idx=Math.min(Math.max(0,restore.idx|0),segs.length-1);R.startIdx=R.idx;
    R.startedAt=now-(wall-restore.started);R.pausedTotal=restore.pausedTotal||0;
    if(restore.paused){R.paused=true;R.pausedAt=now;R.pauseRemain=restore.pauseRemain||0;R.segStart=now-(segs[R.idx].dur*1000-R.pauseRemain);}
    else R.segStart=now-(wall-restore.segStart);
  }
  T.classList.toggle('strength',v.type==='strength');
  $('#tTitle').textContent=v.title;
  $('#tConfirm').hidden=true;
  if(restore&&!R.paused&&!advance(performance.now()))return;   /* 꺼져 있던 동안 지난 구간은 건너뜀 */
  show('timer');paintPlay();lockScreen();
  enterSegment(!restore);
  if(!R.paused)book(!restore);
  keepAlive(!R.paused&&wantKeep());
  initMediaSession();
  R.raf=requestAnimationFrame(frame);
  R.iv=setInterval(bgTick,250);
}
function finish(natural){
  const now=performance.now();
  R.active=false;cancelAnimationFrame(R.raf);clearInterval(R.iv);releaseLock();
  keepAlive(false);clearRun();markDone(R.base);
  if(natural)letRing();else{unbook();chime();}
  $('#zoom').hidden=true;
  const secs=Math.max(0,Math.round((now-R.startedAt-R.pausedTotal)/1000));
  $('#dTitle').textContent=R.rt.title+'을 마쳤어요';
  $('#dTime').textContent='걸린 시간 '+Math.floor(secs/60)+'분 '+(secs%60)+'초';
  history.replaceState({s:'done'},'');show('done');say('루틴 완료. 수고하셨어요.');buzz([80,60,80,60,160]);
}
function stop(){
  if(R){R.active=false;cancelAnimationFrame(R.raf);clearInterval(R.iv);}
  unbook();keepAlive(false);clearRun();
  releaseLock();hush();
  $('#tConfirm').hidden=true;
  history.back();
}

/* 이벤트 */
$('#resumeGo').addEventListener('click',()=>{const s=savedRun();if(s)startRoutine(byId[s.rid],0,false,s);});
$('#resumeDrop').addEventListener('click',()=>{clearRun();paintResume();});
$('#pvBack').addEventListener('click',()=>history.back());
$('#pvStart').addEventListener('click',()=>startRoutine(current,0));
$('#pvEdit').addEventListener('click',()=>{editing=!editing;paintPreview();});
$('#pvRestore').addEventListener('click',()=>{if(!current)return;delete hiddenMap[current.id];store.set('hidden',hiddenMap);paintPreview();renderHome();});
$('#tRing').addEventListener('click',togglePause);
$('#tPlay').addEventListener('click',togglePause);
$('#tPrev').addEventListener('click',goPrev);
$('#tSkip').addEventListener('click',goSkip);
$('#tSetDone').addEventListener('click',setDone);
function openConfirm(){
  if(!R||!R.active||!$('#tConfirm').hidden)return;
  R.wasPaused=R.paused;
  if(!R.paused)togglePause();
  $('#tConfirm').hidden=false;
}
$('#tClose').addEventListener('click',openConfirm);
$('#tStay').addEventListener('click',()=>{
  $('#tConfirm').hidden=true;
  if(R&&!R.wasPaused)togglePause();
});
$('#tEnd').addEventListener('click',stop);
let zoomClosing=false;
[['#tFigure','#tImg'],['#tFigure2','#tImg2']].forEach(([f,i])=>$(f).addEventListener('click',()=>{
  const src=$(i).getAttribute('src');if(!src)return;
  $('#zoomImg').src=src;$('#zoomImg').alt=$(i).alt;$('#zoom').hidden=false;
  history.pushState({s:'zoom'},'');
}));
function closeZoom(){if($('#zoom').hidden)return;$('#zoom').hidden=true;zoomClosing=true;history.back();}
$('#zoom').addEventListener('click',closeZoom);
$('#dAgain').addEventListener('click',()=>startRoutine(R.base,0,true));
$('#dHome').addEventListener('click',()=>history.go(R&&R.back||-2));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#zoom').hidden){closeZoom();return;}
  if(!R||!R.active||T.hidden)return;
  if(e.code==='Space'){e.preventDefault();togglePause();}
  else if(e.key==='ArrowRight')goSkip();
  else if(e.key==='ArrowLeft')goPrev();
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&R&&R.active){lockScreen();bgTick();}
  else persist();
});
window.addEventListener('pagehide',persist);

/* 설정 */
const sSound=$('#setSound'),sVoice=$('#setVoice');
sSound.checked=settings.sound;sVoice.checked=settings.voice;
$('#tLog').addEventListener('input',()=>{$('#tNext').textContent=nextText();});
$('#tLog').addEventListener('click',e=>{if(e.target.closest('button'))$('#tNext').textContent=nextText();});
let resetT=0;
$('#logReset').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(!resetT){b.textContent='한 번 더 누르면 삭제';resetT=setTimeout(()=>{resetT=0;b.textContent='모두 지우기';},4000);return;}
  clearTimeout(resetT);resetT=0;LOG={};DONE={};store.set('log',LOG);store.set('done',DONE);b.textContent='지웠어요';
  setTimeout(()=>{b.textContent='모두 지우기';},1500);renderHome();
});
const sKeep=$('#setKeep');sKeep.checked=settings.keep;
sKeep.addEventListener('change',()=>{settings.keep=sKeep.checked;saveSettings();if(R&&R.active&&!R.paused)keepMedia(true);if(!sKeep.checked&&keepEl)keepEl.pause();});
if(!canSpeak)$('#voiceWrap').hidden=true;
sSound.addEventListener('change',()=>{settings.sound=sSound.checked;saveSettings();if(sSound.checked){ensureAudio();tone(1319,160,0,.85);}});
document.querySelectorAll('[data-vol]').forEach(b=>{
  b.setAttribute('aria-pressed',String(b.dataset.vol===settings.vol));
  b.addEventListener('click',()=>{
    settings.vol=b.dataset.vol;saveSettings();
    document.querySelectorAll('[data-vol]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    ensureAudio();setMasterVol();tone(1319,160,0,.85);
  });
});
sVoice.addEventListener('change',()=>{settings.voice=sVoice.checked;saveSettings();if(sVoice.checked)say('음성 안내를 켰어요');else hush();});
document.querySelectorAll('[data-prep]').forEach(b=>{
  b.setAttribute('aria-pressed',String(+b.dataset.prep===settings.prep));
  b.addEventListener('click',()=>{
    settings.prep=+b.dataset.prep;saveSettings();
    document.querySelectorAll('[data-prep]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    renderHome();
  });
});
document.querySelectorAll('[data-len]').forEach(b=>{
  b.setAttribute('aria-pressed',String(b.dataset.len===settings.len));
  b.addEventListener('click',()=>{
    settings.len=b.dataset.len;saveSettings();
    document.querySelectorAll('[data-len]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    renderHome();
  });
});

history.replaceState({s:'home'},'');
window.addEventListener('popstate',e=>{
  if(zoomClosing){zoomClosing=false;return;}
  if(!$('#zoom').hidden){$('#zoom').hidden=true;return;}
  const s=(e.state&&e.state.s)||'home';
  if(R&&R.active&&!T.hidden){history.pushState({s:'timer'},'');openConfirm();return;}
  if(s==='preview'&&current)openPreview(current,true);
  else if(s==='done')show('done');
  else show('home');
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}

paintTabs();renderHome();
})();
</script>
